# ═══════════════════════════════════════════════════════════════
# hotel-frontend-react/nginx.conf
#
# Serves the Vite-built React SPA and proxies /api/* to Spring Boot.
# Unlike the old multi-page static site, this is a single-page app:
# every unknown path falls back to /index.html so client-side
# routing (react-router) owns the URL — a refresh on /rooms or
# /group/hotels works instead of 404ing.
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Hashed build assets ───────────────────────────────────
    # Vite emits content-hashed filenames (index-BL5QWnkG.js), so they
    # are safe to cache forever — a new build produces a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or clients pin a stale build
    # that references deleted asset hashes.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── API proxy → Spring Boot ───────────────────────────────
    # Matches the BASE = '/api/v1' constant in src/lib/api.ts.
    # nginx resolves proxy_pass hostnames at startup unless a variable
    # is used; the resolver + variable forces per-request DNS so nginx
    # starts independently of the backend (see old config for rationale).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://app:8080;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeout — billing PDF generation can take a few seconds
        proxy_read_timeout 60s;
    }

    # ── Actuator proxy (optional, useful for local debugging) ─
    location /actuator/ {
        set $backend http://app:8080;
        proxy_pass       $backend;
        proxy_set_header Host $host;
    }

    # ── SPA history fallback ──────────────────────────────────
    # Serve the file if it exists, otherwise hand the route to React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
