# ═══════════════════════════════════════════════════════════════
# build.yml — Native Image Build & Push
# Runs on: push to main (after CI passes) or manual trigger
#
# Builds a GraalVM native image via Spring Boot Buildpacks,
# packages it as a Docker image, and pushes it to GHCR.
#
# No extra secrets needed — GITHUB_TOKEN covers GHCR write access.
#
# Image naming:
#   ghcr.io/<owner>/hotel-backend:<sha>     (every build)
#   ghcr.io/<owner>/hotel-backend:<branch>  (e.g. main)
#   ghcr.io/<owner>/hotel-backend:latest    (main branch only)
# ═══════════════════════════════════════════════════════════════
name: Build

on:
  push:
    branches: [ main ]
    paths:
      - "hotel-backend/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to registry?"
        required: true
        default: "true"
        type: choice
        options: [ "true", "false" ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "liberica"
  MAVEN_OPTS: "-Xmx4096m"             # Native compilation is memory-hungry
  REGISTRY: ghcr.io
  # owner/hotel-backend → e.g. ghcr.io/salmanoew/hotel-backend
  IMAGE_NAME: ${{ github.repository_owner }}/hotel-backend

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB: Build native image + push to GHCR
  # ─────────────────────────────────────────────────────────────
  build-native:
    name: "Native Image Build"
    runs-on: ubuntu-latest   # native compile needs ~10 GB RAM — standard runner is fine

    permissions:
      contents: read
      packages: write        # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java ${{ env.JAVA_VERSION }} (Liberica NIK — GraalVM)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('hotel-backend/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Compute image tags — SHA for traceability, branch for convenience,
      # latest for main-branch builds
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 1 of 2: Install all reactor modules to the local Maven repository.
      #
      # WHY two steps are needed:
      #   spring-boot:build-image forks the Maven lifecycle internally before
      #   it checks <skip>. That fork resolves dependencies from the LOCAL
      #   REPOSITORY, not from the reactor. If we run build-image with -am in
      #   a single command, the fork for each library module (identity, room,
      #   etc.) tries to find id.co.hospitops:shared:jar in ~/.m2 — but shared
      #   was only built to target/, not installed. Dependency resolution fails.
      #
      #   Solution: install everything first (no image building, no native
      #   profile, tests skipped for speed), then invoke build-image on
      #   bootstrap ALONE (no -am). With no library modules in the reactor,
      #   there are no forks to trigger and bootstrap resolves all deps from
      #   the freshly populated local repository.
      - name: Install reactor modules to local Maven repository
        working-directory: hotel-backend
        run: |
          mvn install \
            -pl bootstrap -am \
            --batch-mode --no-transfer-progress \
            -DskipTests

      # Step 2 of 2: Build the native Docker image for bootstrap only.
      # No local native-image binary needed — compilation happens inside
      # a build container pulled by the buildpack automatically.
      # Expected build time: 5–15 minutes on a standard GitHub runner.
      - name: Build native Docker image
        working-directory: hotel-backend
        run: |
          mvn -Pnative spring-boot:build-image \
            -pl bootstrap \
            --batch-mode --no-transfer-progress \
            -Dspring-boot.build-image.imageName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Quick sanity check — run the native image for 10s and confirm it
      # starts (it will fail to reach DB, but the process should start cleanly)
      - name: Smoke test native image
        run: |
          docker run --rm -d \
            --name hotel-smoke-test \
            -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://localhost:5432/placeholder \
            -e DB_USER=placeholder \
            -e DB_PASS=placeholder \
            -e JWT_SECRET=smoke-test-secret-key-minimum-32-chars \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} || true

          sleep 10

          # Native image starts in < 1s; we expect to see the startup log
          docker logs hotel-smoke-test 2>&1 | grep -E "Started|ERROR" || true
          docker stop hotel-smoke-test 2>/dev/null || true

      # Tag with all computed metadata tags and push
      - name: Push image to GHCR
        if: |
          github.event_name == 'push' ||
          github.event.inputs.push_image == 'true'
        run: |
          for tag in ${{ join(fromJSON(steps.meta.outputs.json).tags, ' ') }}; do
            docker tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              $tag
            docker push $tag
          done

      - name: Write build summary
        run: |
          echo "## 🐳 Native Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA Tag | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.event.head_commit.message }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for deployment. Trigger the **Deploy** workflow to roll out." >> $GITHUB_STEP_SUMMARY

      # Expose the image tag for the deploy workflow to consume
      - name: Output image tag
        id: image
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
