# ═══════════════════════════════════════════════════════════════
# ci.yml — Continuous Integration
# Runs on: every push to any branch + every pull request
#
# Jobs:
#   test           → compile, unit tests, JaCoCo coverage
#   sonar          → SonarQube analysis (needs test to finish first)
#   frontend-check → nginx.conf validation
#
# Secrets required (set in GitHub → Settings → Secrets):
#   SONAR_TOKEN        → from SonarQube project settings
#   SONAR_HOST_URL     → e.g. http://your-sonar.example.com:9000
# ═══════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "hotel-backend/k8s/**"
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - "**.md"
      - "hotel-backend/k8s/**"

# Cancel in-flight runs of the same workflow on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "liberica"       # Liberica NIK — GraalVM-based, best Spring Boot native support
  MAVEN_OPTS: "-Xmx2048m"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Test + Coverage
  # ─────────────────────────────────────────────────────────────
  test:
    name: "Backend — Test & Coverage"
    runs-on: ubuntu-latest

    # Service container: PostgreSQL for integration tests.
    # Unit tests (domain + application + web slice) don't need this.
    # Only @Tag("integration") tests in bootstrap/ use it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotel_db_test
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_user -d hotel_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed for SonarQube blame annotations
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }} (Liberica NIK)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      # Cache Maven dependencies — dramatically speeds up subsequent runs
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('hotel-backend/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Unit tests only — fast, no DB needed.
      # Integration tests (@Tag("integration")) are excluded here and
      # run separately to keep CI fast. The postgres service above is
      # ready for when integration tests are added.
      - name: Run unit tests with coverage
        working-directory: hotel-backend
        run: |
          mvn clean verify -Pcoverage \
            --batch-mode \
            --no-transfer-progress \
            -Dgroups='!integration' \
            -Dspring.profiles.active=test

      # Upload coverage report for the SonarQube job to consume
      - name: Upload JaCoCo aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: hotel-backend/coverage-aggregate/target/site/jacoco-aggregate/
          retention-days: 1

      # Publish test results as a summary visible in the PR checks UI
      - name: Publish test summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "hotel-backend/**/target/surefire-reports/*.xml"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: SonarQube Analysis
  # ─────────────────────────────────────────────────────────────
  sonar:
    name: "Backend — SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: test    # must have coverage report first
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }} (Liberica NIK)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('hotel-backend/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Restore coverage report produced by the test job
      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: hotel-backend/coverage-aggregate/target/site/jacoco-aggregate/

      # Cache SonarQube scanner — avoids re-downloading on every run
      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      # Compile first — Sonar needs bytecode for its analysis
      - name: Compile (needed for Sonar bytecode analysis)
        working-directory: hotel-backend
        run: mvn compile --batch-mode --no-transfer-progress

      - name: Run SonarQube analysis
        working-directory: hotel-backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn sonar:sonar -Psonar \
            --batch-mode \
            --no-transfer-progress \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number || '' }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref || github.ref_name }} \
            -Dsonar.pullrequest.base=${{ github.base_ref || 'main' }} \
            -Dsonar.scm.revision=${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Frontend — nginx config validation
  # ─────────────────────────────────────────────────────────────
  frontend-check:
    name: "Frontend — Nginx Config Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate nginx.conf
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/hotel-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
