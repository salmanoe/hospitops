# ── Test-only overrides ───────────────────────────────────────────────────────
# Exclude Redis autoconfiguration — no Redis instance in the test environment.
# Spring Boot 4 moved autoconfigure classes to new packages; both old (SB3) and
# new (SB4) names are listed so this works regardless of the exact SB4 layout.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
hospitops.redis.enabled=false
