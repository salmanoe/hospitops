# sonar-project.properties
# Root-level SonarQube configuration.
# Maven properties in pom.xml take precedence over this file.
# Keep sensitive values (token, host URL) out of this file — pass via CLI or env vars.
sonar.projectKey=hospitops-backend
sonar.projectName=HospitOps Backend
sonar.projectVersion=1.0.0
# Java version being analyzed
sonar.java.source=25
# Source encoding
sonar.sourceEncoding=UTF-8
# ── Coverage ──────────────────────────────────────────────────────
# Path to the aggregated JaCoCo XML report.
# Generated by: mvn clean verify -Pcoverage
sonar.coverage.jacoco.xmlReportPaths=\
  coverage-aggregate/target/site/jacoco-aggregate/jacoco.xml
# ── Exclusions ────────────────────────────────────────────────────
# Exclude files that aren't meaningful to unit test or analyze:
#   - JPA entities (framework-driven boilerplate)
#   - MapStruct mappers (generated at compile time)
#   - REST request/response DTOs (pure data holders)
#   - Application entry point (no logic)
#   - Shared domain events (data carriers)
sonar.exclusions=\
  **/infrastructure/persistence/entity/**,\
  **/adapter/web/request/**,\
  **/adapter/web/response/**,\
  **/*JpaEntity.java,\
  **/*Mapper.java,\
  **/HospitOpsApplication.java,\
  **/config/SecurityConfig.java,\
  **/config/CorsConfig.java,\
  **/shared/event/**
sonar.coverage.exclusions=\
  **/infrastructure/persistence/entity/**,\
  **/*JpaEntity.java,\
  **/*Mapper.java,\
  **/HospitOpsApplication.java,\
  **/config/**,\
  **/shared/event/**
# ── Test paths ────────────────────────────────────────────────────
sonar.tests=src/test/java
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*IT.java
# ── Quality Gate ──────────────────────────────────────────────────
# Block pipeline if quality gate fails
sonar.qualitygate.wait=true
