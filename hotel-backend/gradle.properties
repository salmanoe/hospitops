# Gradle runs on the JDK 21 launcher; the Java 25 toolchain below is used for
# compiling/testing. Point Gradle at the installed GraalVM 25 so toolchain
# auto-detection always finds it (forward slashes are valid on Windows here).
org.gradle.java.installations.paths=C:/Program Files/Java/graalvm-jdk-25.0.2+10.1

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
