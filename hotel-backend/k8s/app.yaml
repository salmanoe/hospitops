# ═══════════════════════════════════════════════════════════════
# k8s/app/secret.yaml
#
# Contains: JWT secret, DB credentials (referenced by the app).
# In production use Sealed Secrets or External Secrets Operator.
#
# Encode values: echo -n "your-value" | base64
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: hotel-app-secret
  namespace: hotel
  labels:
    app: hotel-backend
type: Opaque
data:
  # JWT secret — minimum 32 characters. Change this.
  # echo -n "hotelux-production-jwt-secret-key-minimum-32-chars" | base64
  JWT_SECRET: aG90ZWx1eC1wcm9kdWN0aW9uLWp3dC1zZWNyZXQta2V5LW1pbmltdW0tMzItY2hhcnM=

  # DB password — must match postgres-secret POSTGRES_PASSWORD
  DB_PASS: eW91cnBhc3N3b3Jk    # yourpassword

---
# ═══════════════════════════════════════════════════════════════
# k8s/app/configmap.yaml
# Non-sensitive configuration for the app
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-app-config
  namespace: hotel
  labels:
    app: hotel-backend
data:
  # K8s internal DNS for PostgreSQL service
  DB_URL: "jdbc:postgresql://postgres-service.hotel.svc.cluster.local:5432/hotel_db"
  DB_USER: "hotel_user"
  DB_POOL_MAX: "10"

  # Spring profile — enables JSON logging, full health details
  SPRING_PROFILES_ACTIVE: "k8s"

  # Token expiry: 8 hours
  JWT_EXPIRATION_MS: "28800000"

  # Frontend origin for CORS — update to your actual domain
  FRONTEND_URL: "https://hotel.yourdomain.com"

  # Logging
  LOG_LEVEL: "INFO"

  # Port
  PORT: "8080"

  # Prometheus metrics (set to true if you have Prometheus installed)
  PROMETHEUS_ENABLED: "false"

---
# ═══════════════════════════════════════════════════════════════
# k8s/app/deployment.yaml
# ═══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend
  namespace: hotel
  labels:
    app: hotel-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "1.0.0"
  annotations:
    # Track deployments — update on each release
    kubernetes.io/change-cause: "Initial deployment"
spec:
  replicas: 2     # 2 replicas for HA — native image starts in <100ms
  # so rolling updates are near-instant
  selector:
    matchLabels:
      app: hotel-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1   # Spin up 1 new pod before killing old ones
      maxUnavailable: 0   # Never have 0 available pods during update
  template:
    metadata:
      labels:
        app: hotel-backend
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Prometheus auto-scrape (if Prometheus operator is installed)
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      # Graceful shutdown: wait for in-flight requests
      terminationGracePeriodSeconds: 30

      # Don't schedule both replicas on the same node
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - hotel-backend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: hotel-backend
          # Update this to your registry path before deploying:
          # your-registry.io/hotel-backend:1.0.0
          image: hotel-backend:1.0.0-SNAPSHOT
          imagePullPolicy: IfNotPresent   # Always in production with registry

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Load non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: hotel-app-config

          # Load sensitive config from Secrets
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hotel-app-secret
                  key: JWT_SECRET
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: hotel-app-secret
                  key: DB_PASS

          # ── Resource requests & limits ──────────────────────
          # Native image: much lower than JVM
          # JVM equivalent would be: requests 512Mi, limits 1Gi
          resources:
            requests:
              cpu: "100m"    # 0.1 CPU — native starts instantly
              memory: "64Mi"    # Native image baseline
            limits:
              cpu: "500m"    # Burst up to 0.5 CPU
              memory: "128Mi"   # Native image peak

          # ── K8s Probes using Spring Boot Actuator ───────────
          startupProbe:
            # Gives native image time to start (should be < 1s,
            # but allow up to 30s in case of slow node/cold start)
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
            timeoutSeconds: 3

          livenessProbe:
            # Restarts pod if it becomes unhealthy (deadlock, OOM, etc.)
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          readinessProbe:
            # Removes pod from load balancer if it can't serve traffic
            # (e.g. DB connection lost, Flyway running)
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3

          # ── Security context ────────────────────────────────
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      # Temp dir for native image (readOnlyRootFilesystem requires this)
      volumes:
        - name: tmp
          emptyDir: { }

---
# ═══════════════════════════════════════════════════════════════
# k8s/app/service.yaml
# ClusterIP — accessed via Ingress externally
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: hotel-backend-service
  namespace: hotel
  labels:
    app: hotel-backend
spec:
  type: ClusterIP
  selector:
    app: hotel-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# ═══════════════════════════════════════════════════════════════
# k8s/app/hpa.yaml
# Horizontal Pod Autoscaler
# Scale out when CPU > 70% or memory > 80%
# Native image makes this very fast — new pods start in <100ms
# ═══════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hotel-backend-hpa
  namespace: hotel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hotel-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # Scale up quickly
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300   # Scale down slowly (5 min)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
