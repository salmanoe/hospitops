# R-12 FIX: Extracted from postgres.yaml so the Namespace can be
# applied independently — required before any other k8s/ resource.
#
# Apply order:
#   kubectl apply -f k8s/namespace.yaml
#   kubectl apply -f k8s/postgres.yaml
