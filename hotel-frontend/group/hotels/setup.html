<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Hotel Setup — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
    <style>
        body { background-color: var(--bs-body-bg); }

        .group-topbar {
            background: var(--hospitops-surface);
            border-bottom: 1px solid var(--bs-border-color);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .group-topbar .brand {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--hospitops-gold);
            text-decoration: none;
        }

        .group-topbar .brand small {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--hospitops-muted);
            display: block;
            line-height: 1;
            margin-top: 1px;
        }

        /* ── Stepper ── */
        .wizard-stepper {
            display: flex;
            gap: 0;
            margin-bottom: 40px;
            counter-reset: step;
        }

        .wizard-step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            font-size: 12px;
            text-align: center;
        }

        .wizard-step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 16px;
            left: calc(50% + 16px);
            right: calc(-50% + 16px);
            height: 2px;
            background: var(--bs-border-color);
        }

        .wizard-step.done::after   { background: var(--hospitops-gold); }

        .step-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--bs-border-color);
            background: var(--hospitops-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            color: var(--hospitops-muted);
            transition: all .2s;
        }

        .wizard-step.done   .step-dot { background: var(--hospitops-gold); border-color: var(--hospitops-gold); color: #fff; }
        .wizard-step.active .step-dot { border-color: var(--hospitops-gold); color: var(--hospitops-gold); }

        .step-label { color: var(--hospitops-muted); font-size: 11px; }
        .wizard-step.done   .step-label { color: var(--hospitops-gold); }
        .wizard-step.active .step-label { color: var(--bs-body-color); font-weight: 600; }

        /* ── Step cards ── */
        .step-card {
            background: var(--hospitops-surface);
            border: 1px solid var(--bs-border-color);
            border-radius: 10px;
            padding: 24px 28px;
            margin-bottom: 16px;
        }

        .step-card.done-card {
            opacity: 0.65;
        }

        .step-card .step-title {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-card .step-desc {
            font-size: 13px;
            color: var(--hospitops-muted);
            margin-top: 6px;
        }

        .step-card .step-actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ── Active banner ── */
        .active-banner {
            background: #d1e7dd;
            border: 1px solid #a3cfbb;
            border-radius: 10px;
            padding: 20px 28px;
            display: none;
        }
    </style>
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────────── -->
<div class="group-topbar">
    <a href="/group/dashboard.html" class="brand">
        HospitOps
        <small>GROUP ADMIN</small>
    </a>
    <div class="d-flex align-items-center gap-3">
        <a href="/group/hotels/list.html" class="text-muted small">← Hotels</a>
        <span id="admin-email" class="text-muted small"></span>
        <a href="#" id="logout-btn" class="text-danger small">Sign out</a>
    </div>
</div>

<!-- ── Page body ───────────────────────────────────────────── -->
<div class="page-body" style="max-width: 760px; margin: 0 auto;">

    <!-- Loading -->
    <div id="loading-state" class="text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm me-2"></div>
        Loading hotel…
    </div>

    <!-- Error -->
    <div id="error-state" class="alert alert-danger d-none" role="alert"></div>

    <!-- Content -->
    <div id="content" class="d-none">
        <h2 id="page-title" class="mb-1" style="font-family:'Playfair Display',serif;font-size:22px;"></h2>
        <p class="text-muted small mb-4" id="page-subtitle"></p>

        <!-- Stepper -->
        <div class="wizard-stepper" id="stepper"></div>

        <!-- Active banner (shown when hotel is already ACTIVE) -->
        <div class="active-banner" id="active-banner">
            <div class="fw-semibold text-success mb-1">✓ Hotel is ACTIVE</div>
            <div class="text-muted small">All setup steps are complete. You can now enter the hotel or manage its policy.</div>
            <div class="mt-3 d-flex gap-2 flex-wrap">
                <button id="enter-hotel-btn" class="btn btn-gold btn-sm">Enter Hotel →</button>
                <a id="policy-link" href="#" class="btn btn-outline-secondary btn-sm">Manage Policy</a>
            </div>
        </div>

        <!-- Step cards -->
        <div id="step-cards"></div>

        <!-- Toast area -->
        <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>
    </div>

</div>

<!-- ── Enter hotel confirm modal ──────────────────────────── -->
<div class="modal fade" id="enter-modal" tabindex="-1" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Enter Hotel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Switch into <strong id="enter-hotel-name"></strong> as a hotel-scoped session?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="enter-confirm-btn" class="btn btn-gold btn-sm">Enter Hotel</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script>
    if (!Auth.requireGroupAdmin()) throw new Error('Unauthorized');

    const user = Auth.getUser();
    document.getElementById('admin-email').textContent = user?.username ?? '';

    document.getElementById('logout-btn').addEventListener('click', (e) => {
        e.preventDefault();
        Auth.clear();
        window.location.href = '/group/login.html';
    });

    // ── Read hotelId from URL ─────────────────────────────────
    const hotelId = new URLSearchParams(location.search).get('hotelId');
    if (!hotelId) window.location.href = '/group/hotels/list.html';

    const loadingEl  = document.getElementById('loading-state');
    const errorEl    = document.getElementById('error-state');
    const contentEl  = document.getElementById('content');

    // ── Step metadata ─────────────────────────────────────────
    const STEPS = [
        {
            key:   'PROFILE',
            label: 'Profile',
            title: 'Hotel Profile',
            desc:  'Confirm the hotel name and basic details are set. Click "Mark complete" once reviewed.',
            action: 'mark', // calls POST /setup/PROFILE directly
        },
        {
            key:   'POLICY',
            label: 'Policy',
            title: 'Policy Config',
            desc:  'Set check-in/out times, tax rate, and invoice branding. Saving the policy auto-completes this step.',
            action: 'link',
            href:  () => `/group/hotels/policy.html?hotelId=${hotelId}`,
            linkText: 'Configure Policy →',
        },
        {
            key:   'ROOM_TYPE',
            label: 'Room Type',
            title: 'Room Types',
            desc:  'Add at least one room type (e.g. Deluxe, Suite). Creating a room type auto-completes this step.',
            action: 'link',
            href:  () => `/rooms/types.html`,
            linkText: 'Add Room Type →',
        },
        {
            key:   'ROOM',
            label: 'Rooms',
            title: 'Rooms',
            desc:  'Add at least one physical room linked to a room type. Creating a room auto-completes this step.',
            action: 'link',
            href:  () => `/rooms/list.html`,
            linkText: 'Add Room →',
        },
        {
            key:   'STAFF_ACCOUNT',
            label: 'Staff',
            title: 'First Staff Account',
            desc:  'Create at least one ADMIN or MANAGER staff account. Creating a staff account auto-completes this step.',
            action: 'link',
            href:  () => `/staff/form.html`,
            linkText: 'Add Staff →',
        },
    ];

    function escHtml(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderStepper(remaining) {
        const remainingSet = new Set(remaining);
        return STEPS.map((step, i) => {
            const done   = !remainingSet.has(step.key);
            const active = !done && remaining[0] === step.key;
            const cls    = done ? 'done' : (active ? 'active' : '');
            return `
            <div class="wizard-step ${cls}">
                <div class="step-dot">${done ? '✓' : (i + 1)}</div>
                <div class="step-label">${step.label}</div>
            </div>`;
        }).join('');
    }

    function renderStepCards(hotel, remaining) {
        const remainingSet = new Set(remaining);
        return STEPS.map(step => {
            const done = !remainingSet.has(step.key);

            let actionHtml = '';
            if (!done) {
                if (step.action === 'mark') {
                    actionHtml = `
                        <button class="btn btn-gold btn-sm mark-btn" data-step="${step.key}">
                            Mark complete
                        </button>`;
                } else {
                    // Use a button that enters this hotel's context first, then navigates.
                    // This guarantees HotelContext is bound to the correct hotel regardless
                    // of which hotel (if any) the GROUP_ADMIN entered previously.
                    actionHtml = `
                        <button class="btn btn-outline-secondary btn-sm enter-then-go-btn"
                                data-href="${escHtml(step.href())}">
                            ${step.linkText}
                        </button>
                        <button class="btn btn-link btn-sm text-muted p-0 ms-2 mark-btn" data-step="${step.key}"
                                title="If you've already completed this action, mark it done">
                            Already done?
                        </button>`;
                }
            }

            return `
            <div class="step-card ${done ? 'done-card' : ''}">
                <div class="step-title">
                    <span class="badge ${done ? 'bg-success' : 'bg-warning text-dark'}">
                        ${done ? '✓ Done' : 'Pending'}
                    </span>
                    ${escHtml(step.title)}
                </div>
                <div class="step-desc">${escHtml(step.desc)}</div>
                ${!done ? `<div class="step-actions">${actionHtml}</div>` : ''}
            </div>`;
        }).join('');
    }

    async function load() {
        Utils.show(loadingEl);
        Utils.hide(errorEl);
        Utils.hide(contentEl);
        try {
            const hotel = await API.hotels.get(hotelId);
            Utils.hide(loadingEl);
            render(hotel);
        } catch (err) {
            Utils.hide(loadingEl);
            errorEl.textContent = err.message || 'Failed to load hotel.';
            Utils.show(errorEl);
        }
    }

    function render(hotel) {
        document.getElementById('page-title').textContent    = hotel.name;
        document.getElementById('page-subtitle').textContent = `Setup wizard · ${hotel.status}`;

        const remaining = hotel.remainingSetupSteps ?? [];

        document.getElementById('stepper').innerHTML    = renderStepper(remaining);
        document.getElementById('step-cards').innerHTML = renderStepCards(hotel, remaining);

        const activeBanner = document.getElementById('active-banner');
        if (hotel.status === 'ACTIVE') {
            activeBanner.style.display = 'block';
            document.getElementById('policy-link').href = `/group/hotels/policy.html?hotelId=${hotelId}`;
        } else {
            activeBanner.style.display = 'none';
        }

        Utils.show(contentEl);

        // Wire "Mark complete" buttons
        document.querySelectorAll('.mark-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const step = btn.dataset.step;
                Utils.loading(btn, true);
                try {
                    const updated = await API.hotels.completeSetupStep(hotelId, step);
                    Utils.toast(`Step "${step}" marked complete.`, 'success');
                    render(updated);
                } catch (err) {
                    Utils.toast(err.message || 'Failed to complete step.', 'danger');
                    Utils.loading(btn, false);
                }
            });
        });

        // Wire action buttons: enter this hotel's context first, then navigate.
        // Prevents showing the wrong hotel's data if GROUP_ADMIN was previously
        // in a different hotel's session (or in group-scoped mode).
        document.querySelectorAll('.enter-then-go-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const dest = btn.dataset.href;
                Utils.loading(btn, true);
                try {
                    const res = await API.groupAuth.enterHotel(hotelId);
                    Auth.save(res);
                    window.location.href = dest;
                } catch (err) {
                    Utils.toast(err.message || 'Failed to enter hotel session.', 'danger');
                    Utils.loading(btn, false);
                }
            });
        });
    }

    // ── Enter hotel modal ─────────────────────────────────────
    const enterModal      = new bootstrap.Modal(document.getElementById('enter-modal'));
    const enterConfirmBtn = document.getElementById('enter-confirm-btn');
    let   _hotelName      = '';

    document.getElementById('enter-hotel-btn')?.addEventListener('click', () => {
        _hotelName = document.getElementById('page-title').textContent;
        document.getElementById('enter-hotel-name').textContent = _hotelName;
        enterModal.show();
    });

    enterConfirmBtn.addEventListener('click', async () => {
        Utils.loading(enterConfirmBtn, true);
        try {
            const res = await API.groupAuth.enterHotel(hotelId);
            Auth.save(res);
            enterModal.hide();
            window.location.href = '/dashboard.html';
        } catch (err) {
            enterModal.hide();
            Utils.toast(err.message || 'Failed to enter hotel.', 'danger');
            Utils.loading(enterConfirmBtn, false);
        }
    });

    load();
</script>
</body>
</html>
