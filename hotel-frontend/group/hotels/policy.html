<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Hotel Policy — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
    <style>
        body { background-color: var(--bs-body-bg); }

        .group-topbar {
            background: var(--hospitops-surface);
            border-bottom: 1px solid var(--bs-border-color);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .group-topbar .brand {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--hospitops-gold);
            text-decoration: none;
        }

        .group-topbar .brand small {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--hospitops-muted);
            display: block;
            line-height: 1;
            margin-top: 1px;
        }

        .form-card {
            background: var(--hospitops-surface);
            border: 1px solid var(--bs-border-color);
            border-radius: 10px;
            padding: 32px;
            max-width: 600px;
        }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--hospitops-muted);
            margin-bottom: 12px;
            margin-top: 24px;
            border-bottom: 1px solid var(--bs-border-color);
            padding-bottom: 6px;
        }
    </style>
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────────── -->
<div class="group-topbar">
    <a href="/group/dashboard.html" class="brand">
        HospitOps
        <small>GROUP ADMIN</small>
    </a>
    <div class="d-flex align-items-center gap-3">
        <a href="/group/hotels/list.html" class="text-muted small">← Hotels</a>
        <span id="admin-email" class="text-muted small"></span>
        <a href="#" id="logout-btn" class="text-danger small">Sign out</a>
    </div>
</div>

<!-- ── Page body ───────────────────────────────────────────── -->
<div class="page-body">

    <!-- Loading -->
    <div id="loading-state" class="text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm me-2"></div>
        Loading policy…
    </div>

    <!-- Error -->
    <div id="error-state" class="alert alert-danger d-none" role="alert"></div>

    <!-- Form -->
    <div id="content" class="d-none">
        <h2 id="page-title" class="mb-1" style="font-family:'Playfair Display',serif;font-size:22px;">Policy Config</h2>
        <p class="text-muted small mb-4" id="page-subtitle"></p>

        <div class="form-card">
            <form id="policy-form" novalidate>

                <!-- Tax -->
                <div class="section-label">Tax</div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-4">
                        <label for="tax-percent" class="form-label fw-semibold">Tax Rate (%)</label>
                        <input type="number" id="tax-percent" class="form-control"
                               min="0" max="100" step="1" required
                               placeholder="11"/>
                        <div class="invalid-feedback">Enter a value between 0 and 100.</div>
                    </div>
                    <div class="col-sm-8">
                        <label for="tax-name" class="form-label fw-semibold">Tax Label</label>
                        <input type="text" id="tax-name" class="form-control"
                               maxlength="50" required
                               placeholder="PPN"/>
                        <div class="form-text">Shown on invoices, e.g. PPN, VAT, GST.</div>
                        <div class="invalid-feedback">Tax label is required (max 50 characters).</div>
                    </div>
                </div>

                <!-- Invoice branding -->
                <div class="section-label">Invoice Branding</div>

                <div class="mb-3">
                    <label for="invoice-hotel-name" class="form-label fw-semibold">Hotel Name on Invoice</label>
                    <input type="text" id="invoice-hotel-name" class="form-control"
                           maxlength="200" required
                           placeholder="The Grand Nusantara"/>
                    <div class="invalid-feedback">Invoice hotel name is required (max 200 characters).</div>
                </div>

                <div class="mb-3">
                    <label for="invoice-address" class="form-label fw-semibold">Invoice Address <span class="text-muted fw-normal">(optional)</span></label>
                    <textarea id="invoice-address" class="form-control" rows="2"
                              placeholder="Jl. Sudirman No. 1, Jakarta"></textarea>
                </div>

                <div class="mb-4">
                    <label for="invoice-footer" class="form-label fw-semibold">Invoice Footer Note <span class="text-muted fw-normal">(optional)</span></label>
                    <textarea id="invoice-footer" class="form-control" rows="2"
                              placeholder="Thank you for staying with us."></textarea>
                </div>

                <div id="error-msg" class="alert alert-danger d-none" role="alert"></div>
                <div id="success-msg" class="alert alert-success d-none" role="alert">Policy saved.</div>

                <div class="d-flex gap-2">
                    <button type="submit" id="submit-btn" class="btn btn-gold">Save Policy</button>
                    <a href="/group/hotels/list.html" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script>
    if (!Auth.requireGroupAdmin()) throw new Error('Unauthorized');

    const user = Auth.getUser();
    document.getElementById('admin-email').textContent = user?.username ?? '';

    document.getElementById('logout-btn').addEventListener('click', (e) => {
        e.preventDefault();
        Auth.clear();
        window.location.href = '/group/login.html';
    });

    const hotelId = new URLSearchParams(location.search).get('hotelId');
    if (!hotelId) window.location.href = '/group/hotels/list.html';

    const loadingEl  = document.getElementById('loading-state');
    const errorEl    = document.getElementById('error-state');
    const contentEl  = document.getElementById('content');
    const errorMsg   = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const submitBtn  = document.getElementById('submit-btn');
    const form       = document.getElementById('policy-form');

    function fillForm(p) {
        document.getElementById('tax-percent').value        = p.taxPercent ?? 0;
        document.getElementById('tax-name').value           = p.taxName ?? '';
        document.getElementById('invoice-hotel-name').value = p.invoiceHotelName ?? '';
        document.getElementById('invoice-address').value    = p.invoiceAddress ?? '';
        document.getElementById('invoice-footer').value     = p.invoiceFooterNote ?? '';
    }

    async function load() {
        Utils.show(loadingEl);
        Utils.hide(errorEl);
        Utils.hide(contentEl);

        try {
            // Load hotel name and existing policy in parallel.
            const [hotel, policy] = await Promise.allSettled([
                API.hotels.get(hotelId),
                API.hotelPolicy.get(hotelId),
            ]);

            Utils.hide(loadingEl);

            const hotelName = hotel.status === 'fulfilled' ? hotel.value.name : 'Hotel';
            document.getElementById('page-title').textContent    = `${hotelName} — Policy`;
            document.getElementById('page-subtitle').textContent = 'Tax settings and invoice branding';

            if (policy.status === 'fulfilled') {
                fillForm(policy.value);
            }
            // 404 is fine — just show the empty form for first-time setup.

            Utils.show(contentEl);
        } catch (err) {
            Utils.hide(loadingEl);
            errorEl.textContent = err.message || 'Failed to load policy.';
            Utils.show(errorEl);
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        form.classList.add('was-validated');
        if (!form.checkValidity()) return;

        Utils.loading(submitBtn, true);
        Utils.hide(errorMsg);
        Utils.hide(successMsg);

        const data = {
            taxPercent:       parseInt(document.getElementById('tax-percent').value, 10),
            taxName:          document.getElementById('tax-name').value.trim(),
            invoiceHotelName: document.getElementById('invoice-hotel-name').value.trim(),
            invoiceAddress:   document.getElementById('invoice-address').value.trim() || null,
            invoiceFooterNote: document.getElementById('invoice-footer').value.trim() || null,
        };

        try {
            await API.hotelPolicy.save(hotelId, data);
            Utils.show(successMsg);
            Utils.toast('Policy saved successfully.', 'success');
        } catch (err) {
            errorMsg.textContent = err.message || 'Failed to save policy.';
            Utils.show(errorMsg);
        } finally {
            Utils.loading(submitBtn, false);
        }
    });

    load();
</script>
</body>
</html>
