<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Group Profile — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
    <style>
        body { background-color: var(--bs-body-bg); }

        .group-topbar {
            background: var(--hospitops-surface);
            border-bottom: 1px solid var(--bs-border-color);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .group-topbar .brand {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--hospitops-gold);
            text-decoration: none;
        }

        .group-topbar .brand small {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--hospitops-muted);
            display: block;
            line-height: 1;
            margin-top: 1px;
        }

        .profile-card {
            background: var(--hospitops-surface);
            border: 1px solid var(--bs-border-color);
            border-radius: 10px;
            padding: 32px;
            max-width: 520px;
        }

        .profile-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 0;
            border-bottom: 1px solid var(--bs-border-color);
        }

        .profile-row:last-child { border-bottom: none; }

        .profile-row .row-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--hospitops-muted);
        }

        .profile-row .row-value {
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────────── -->
<div class="group-topbar">
    <a href="/group/dashboard.html" class="brand">
        HospitOps
        <small>GROUP ADMIN</small>
    </a>
    <div class="d-flex align-items-center gap-3">
        <a href="/group/dashboard.html"   class="text-muted small">Dashboard</a>
        <a href="/group/hotels/list.html" class="text-muted small">Hotels</a>
        <span id="admin-email" class="text-muted small"></span>
        <a href="#" id="logout-btn" class="text-danger small">Sign out</a>
    </div>
</div>

<!-- ── Page body ───────────────────────────────────────────── -->
<div class="page-body">

    <h2 class="mb-1" style="font-family:'Playfair Display',serif;font-size:22px;">Group Profile</h2>
    <p class="text-muted small mb-4">Your hotel group account details.</p>

    <!-- Loading -->
    <div id="loading-state" class="text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm me-2"></div>
        Loading profile…
    </div>

    <!-- Error -->
    <div id="error-state" class="alert alert-danger d-none" role="alert"></div>

    <!-- Content -->
    <div id="content" class="d-none">
        <div class="profile-card">
            <div class="profile-row">
                <div class="row-label">Group Name</div>
                <div class="row-value" id="group-name">—</div>
            </div>
            <div class="profile-row">
                <div class="row-label">Owner / Admin Email</div>
                <div class="row-value" id="owner-email">—</div>
            </div>
            <div class="profile-row">
                <div class="row-label">Group ID</div>
                <div class="row-value text-muted" style="font-size:13px;font-family:monospace;" id="group-id">—</div>
            </div>
            <div class="profile-row">
                <div class="row-label">Member Since</div>
                <div class="row-value" id="created-at">—</div>
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <a href="/group/hotels/list.html" class="btn btn-gold btn-sm">Manage Hotels</a>
            <a href="/group/dashboard.html"   class="btn btn-outline-secondary btn-sm">Dashboard</a>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script>
    if (!Auth.requireGroupAdmin()) throw new Error('Unauthorized');

    const user = Auth.getUser();
    document.getElementById('admin-email').textContent = user?.username ?? '';

    document.getElementById('logout-btn').addEventListener('click', (e) => {
        e.preventDefault();
        Auth.clear();
        window.location.href = '/group/login.html';
    });

    const loadingEl = document.getElementById('loading-state');
    const errorEl   = document.getElementById('error-state');
    const contentEl = document.getElementById('content');

    async function load() {
        Utils.show(loadingEl);
        Utils.hide(errorEl);
        Utils.hide(contentEl);
        try {
            const profile = await API.group.profile();
            Utils.hide(loadingEl);

            document.getElementById('group-name').textContent  = profile.name ?? '—';
            document.getElementById('owner-email').textContent = profile.ownerEmail ?? '—';
            document.getElementById('group-id').textContent    = profile.id ?? '—';
            document.getElementById('created-at').textContent  =
                profile.createdAt ? Utils.formatDate(profile.createdAt) : '—';

            Utils.show(contentEl);
        } catch (err) {
            Utils.hide(loadingEl);
            errorEl.textContent = err.message || 'Failed to load group profile.';
            Utils.show(errorEl);
        }
    }

    load();
</script>
</body>
</html>
