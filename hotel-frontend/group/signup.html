<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Create Group Account — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body class="login-page">

<div class="login-card">
    <div class="text-center mb-4">
        <div class="login-brand">HospitOps</div>
        <small class="text-muted" style="letter-spacing:3px;font-size:11px;">GROUP ADMINISTRATION</small>
    </div>

    <h6 class="mb-1">Create Your Group Account</h6>
    <p class="text-muted small mb-4">Set up your hotel portfolio in minutes</p>

    <div id="alert" class="alert alert-danger d-none" role="alert"></div>

    <form id="signup-form" novalidate>
        <div class="mb-3">
            <label class="form-label">Group Name</label>
            <input type="text" id="groupName" name="groupName" class="form-control"
                   placeholder="e.g. Archipelago Hotels Group" maxlength="200"
                   autocomplete="organization" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Admin Email</label>
            <input type="email" id="adminEmail" name="adminEmail" class="form-control"
                   placeholder="admin@yourgroup.com" maxlength="150"
                   autocomplete="email" required/>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Min. 8 characters" minlength="8" maxlength="100"
                   autocomplete="new-password" required/>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-gold w-100">Create Account</button>
    </form>

    <p class="text-center mt-4 mb-0" style="font-size:12px;">
        Already have an account?
        <a href="/group/login.html" class="text-muted">Sign in →</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script>
    // Redirect if already logged in as GROUP_ADMIN
    if (Auth.isLoggedIn() && Auth.isGroupAdmin()) {
        window.location.href = '/group/dashboard.html';
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn   = document.getElementById('submit-btn');
        const alert = document.getElementById('alert');
        alert.classList.add('d-none');
        Utils.setFormErrors({});
        Utils.loading(btn, true);

        try {
            await API.groupAuth.signup(
                document.getElementById('groupName').value,
                document.getElementById('adminEmail').value,
                document.getElementById('password').value
            );
            // Signup returns account details, not a token — redirect to login with a success cue.
            window.location.href = '/group/login.html?registered=1';
        } catch (err) {
            if (err.details && typeof err.details === 'object') {
                Utils.setFormErrors(err.details);
            } else {
                alert.textContent = err.message || 'Sign up failed. Please try again.';
                alert.classList.remove('d-none');
            }
            Utils.loading(btn, false);
        }
    });
</script>
</body>
</html>
