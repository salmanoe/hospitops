<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Room Types — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="rooms">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">Room Types</h2>
        <div class="d-flex gap-2">
            <a href="/rooms/list.html" class="btn btn-outline-secondary btn-sm">← Rooms</a>
            <button class="btn btn-gold btn-sm" data-bs-toggle="modal" data-bs-target="#typeModal">
                ＋ Add Type
            </button>
        </div>
    </div>
    <div class="page-body">
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr><th>Name</th><th>Capacity</th><th>Base Rate/Night</th>
                            <th>Description</th><th></th></tr>
                    </thead>
                    <tbody id="types-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="typeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">Add Room Type</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id"/>
                <div class="mb-3">
                    <label class="form-label">Name *</label>
                    <input type="text" id="rt-name" class="form-control" placeholder="e.g. Deluxe"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Capacity *</label>
                    <input type="number" id="rt-capacity" class="form-control" min="1" value="2"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Base Price / Night (IDR) *</label>
                    <input type="number" id="rt-price" class="form-control" min="1" step="10000"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="rt-desc" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="type-save-btn" class="btn btn-gold">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireRole('ADMIN', 'MANAGER', 'GROUP_ADMIN');
const modal = new bootstrap.Modal(document.getElementById('typeModal'));

async function load() {
    const data  = await API.roomTypes.list({ size: 100 });
    document.getElementById('types-tbody').innerHTML = (data.content || []).map(rt => `
        <tr>
            <td><strong>${rt.name}</strong></td>
            <td>${rt.capacity} pax</td>
            <td>${Utils.formatRp(rt.basePrice)}</td>
            <td class="text-muted small">${rt.description || '—'}</td>
            <td>
                <button class="btn btn-outline-secondary btn-sm" onclick="openEdit('${rt.id}')">Edit</button>
            </td>
        </tr>`).join('');
}

async function openEdit(id) {
    const rt = await API.roomTypes.get(id);
    document.getElementById('edit-id').value      = rt.id;
    document.getElementById('rt-name').value      = rt.name;
    document.getElementById('rt-capacity').value  = rt.capacity;
    document.getElementById('rt-price').value     = rt.basePrice;
    document.getElementById('rt-desc').value      = rt.description || '';
    document.getElementById('modal-title').textContent = 'Edit Room Type';
    modal.show();
}

document.getElementById('typeModal').addEventListener('hidden.bs.modal', () => {
    document.getElementById('edit-id').value = '';
    document.getElementById('modal-title').textContent = 'Add Room Type';
    ['rt-name','rt-capacity','rt-price','rt-desc'].forEach(id =>
        document.getElementById(id).value = '');
});

document.getElementById('type-save-btn').addEventListener('click', async () => {
    const btn  = document.getElementById('type-save-btn');
    const id   = document.getElementById('edit-id').value;
    const data = {
        name:        document.getElementById('rt-name').value,
        capacity:    +document.getElementById('rt-capacity').value,
        basePrice:   +document.getElementById('rt-price').value,
        description: document.getElementById('rt-desc').value || null,
    };
    Utils.loading(btn, true);
    try {
        if (id) await API.roomTypes.update(id, data);
        else    await API.roomTypes.create(data);
        Utils.toast(id ? 'Room type updated' : 'Room type created');
        modal.hide(); load();
    } catch (e) { Utils.toast(e.message, 'danger'); }
    Utils.loading(btn, false);
});

load();
</script>
</body>
</html>
