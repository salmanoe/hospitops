<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Room — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="rooms">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title" id="page-title">Add Room</h2>
        <a href="/rooms/list.html" class="btn btn-outline-secondary btn-sm">← Back</a>
    </div>
    <div class="page-body">
        <div style="max-width:560px">
            <form id="room-form" novalidate>

                <div class="card mb-3">
                    <div class="card-header">Room Details</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Room Number *</label>
                                <input type="text" name="roomNumber" class="form-control"
                                       placeholder="e.g. 101, 204A" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Floor *</label>
                                <input type="number" name="floor" class="form-control"
                                       min="1" max="99" placeholder="1" required/>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Room Type *</label>
                                <select name="roomTypeId" class="form-select" required>
                                    <option value="">— Select type —</option>
                                </select>
                            </div>
                            <div class="col-12" id="status-group" style="display:none">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-select">
                                    <option value="AVAILABLE">Available</option>
                                    <option value="DIRTY">Dirty</option>
                                    <option value="MAINTENANCE">Maintenance</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Notes</label>
                                <textarea name="notes" class="form-control" rows="2"
                                          placeholder="e.g. connecting room, corner unit…"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a href="/rooms/list.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" id="submit-btn" class="btn btn-gold">Save Room</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireRole('ADMIN', 'MANAGER');
const roomId = Utils.getParam('id');
const isEdit = !!roomId;

async function init() {
    document.getElementById('page-title').textContent = isEdit ? 'Edit Room' : 'Add Room';
    if (isEdit) document.getElementById('status-group').style.display = '';

    // Load room types for select
    const types = await API.roomTypes.list({ size: 100 });
    const sel = document.querySelector('[name="roomTypeId"]');
    (types.content || []).forEach(rt => {
        const opt = new Option(`${rt.name} — ${Utils.formatRp(rt.basePrice)}/night`, rt.id);
        sel.appendChild(opt);
    });

    // If editing, load current values
    if (isEdit) {
        const room = await API.rooms.get(roomId);
        document.querySelector('[name="roomNumber"]').value = room.roomNumber;
        document.querySelector('[name="roomNumber"]').readOnly = true;
        document.querySelector('[name="floor"]').value    = room.floor;
        document.querySelector('[name="roomTypeId"]').value = room.roomTypeId;
        document.querySelector('[name="status"]').value   = room.status;
        document.querySelector('[name="notes"]').value    = room.notes || '';
    }
}

document.getElementById('room-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    Utils.loading(btn, true);
    const data = Utils.formData(e.target);
    data.floor = +data.floor;

    try {
        if (isEdit) {
            await API.rooms.update(roomId, { floor: data.floor, notes: data.notes });
        } else {
            await API.rooms.create(data);
        }
        Utils.toast(isEdit ? 'Room updated' : 'Room added');
        window.location.href = '/rooms/list.html';
    } catch (err) {
        Utils.setFormErrors(err.details || {});
        Utils.toast(err.message, 'danger');
        Utils.loading(btn, false);
    }
});

init();
</script>
</body>
</html>
