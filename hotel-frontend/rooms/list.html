<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Rooms — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="rooms">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">Rooms</h2>
        <a href="/rooms/form.html" class="btn btn-gold btn-sm">＋ Add Room</a>
    </div>
    <div class="page-body">

        <!-- Stats row -->
        <div class="row g-3 mb-4" id="room-stats"></div>

        <!-- Filter bar -->
        <div class="d-flex gap-2 flex-wrap mb-3">
            <button class="btn btn-gold btn-sm filter-btn" data-status="">All</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="AVAILABLE">Available</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="OCCUPIED">Occupied</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="DIRTY">Dirty</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="MAINTENANCE">Maintenance</button>
            <div class="ms-auto">
                <a href="/rooms/types.html" class="btn btn-outline-secondary btn-sm">
                    Manage Room Types →
                </a>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Room</th><th>Floor</th><th>Type</th>
                            <th>Capacity</th><th>Rate/Night</th>
                            <th>Status</th><th>Notes</th><th></th>
                        </tr>
                    </thead>
                    <tbody id="rooms-tbody"></tbody>
                </table>
            </div>
            <div class="card-body pt-0" id="pagination"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireRole('ADMIN', 'MANAGER');
let currentPage = 0, currentStatus = '';

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('btn-gold'); b.classList.add('btn-outline-secondary');
        });
        btn.classList.add('btn-gold'); btn.classList.remove('btn-outline-secondary');
        currentStatus = btn.dataset.status; currentPage = 0; load();
    });
});

async function load() {
    const params = { page: currentPage, size: 50 };
    if (currentStatus) params.status = currentStatus;
    const data = await API.rooms.list(params);
    const rooms = data.content || [];

    // Stats — only meaningful when showing all rooms (no status filter).
    // Counts are derived from the current page; for accurate totals across
    // all pages use the server-side totalElements for the "Total" figure.
    const counts = { AVAILABLE: 0, OCCUPIED: 0, DIRTY: 0, MAINTENANCE: 0 };
    rooms.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
    const totalRooms = currentStatus ? rooms.length : (data.totalElements ?? rooms.length);
    document.getElementById('room-stats').innerHTML = [
        ['Total',       totalRooms,          'secondary'],
        ['Available',   counts.AVAILABLE,    'success'],
        ['Occupied',    counts.OCCUPIED,     'warning'],
        ['Dirty',       counts.DIRTY,        'secondary'],
        ['Maintenance', counts.MAINTENANCE,  'danger'],
    ].map(([label, val, color]) => `
        <div class="col-6 col-md-2">
            <div class="card stat-card p-3">
                <div class="stat-label">${label}</div>
                <div class="stat-value text-${color}">${val}</div>
            </div>
        </div>`).join('');

    document.getElementById('rooms-tbody').innerHTML = rooms.length
        ? rooms.map(r => `
            <tr>
                <td><strong>${r.roomNumber}</strong></td>
                <td>${r.floor}</td>
                <td>${r.roomTypeName}</td>
                <td>${r.capacity ?? '—'}</td>
                <td>${Utils.formatRp(r.basePrice)}</td>
                <td>${Utils.statusBadge(r.status)}</td>
                <td class="text-muted small">${r.notes || '—'}</td>
                <td>
                    <a href="/rooms/form.html?id=${r.id}"
                       class="btn btn-outline-secondary btn-sm">Edit</a>
                </td>
            </tr>`).join('')
        : '<tr><td colspan="8" class="text-center text-muted py-4">No rooms found</td></tr>';

    Utils.renderPagination('pagination', data, p => { currentPage = p; load(); });
}
load();
</script>
</body>
</html>
