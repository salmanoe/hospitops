<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Dashboard — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="dashboard">

<div id="sidebar"></div>

<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">Dashboard</h2>
        <span id="today-date" class="text-muted small"></span>
    </div>

    <div class="page-body">

        <!-- Stat Cards -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card stat-card p-3">
                    <div class="stat-label">Occupied</div>
                    <div class="stat-value" id="stat-occupied">—</div>
                    <small class="text-muted" id="stat-total-rooms"></small>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card p-3">
                    <div class="stat-label">Available</div>
                    <div class="stat-value" id="stat-available">—</div>
                    <small class="text-muted">Ready to book</small>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card p-3">
                    <div class="stat-label">Arrivals Today</div>
                    <div class="stat-value" id="stat-arrivals">—</div>
                    <small class="text-muted">Expected check-ins</small>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card p-3">
                    <div class="stat-label">Departures Today</div>
                    <div class="stat-value" id="stat-departures">—</div>
                    <small class="text-muted">Expected check-outs</small>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Today's Arrivals -->
            <div class="col-12 col-lg-6">
                <div class="card">
                    <div class="card-header">Today's Arrivals</div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Guest</th><th>Room</th><th>Nights</th>
                                    <th>Status</th><th></th>
                                </tr>
                            </thead>
                            <tbody id="arrivals-tbody">
                                <tr><td colspan="5" class="text-center text-muted py-4">
                                    <div class="spinner-border spinner-border-sm"></div>
                                </td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Today's Departures -->
            <div class="col-12 col-lg-6">
                <div class="card">
                    <div class="card-header">Today's Departures</div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Guest</th><th>Room</th><th>Balance</th>
                                    <th>Status</th><th></th>
                                </tr>
                            </thead>
                            <tbody id="departures-tbody">
                                <tr><td colspan="5" class="text-center text-muted py-4">
                                    <div class="spinner-border spinner-border-sm"></div>
                                </td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireHotelSession();

// Set today's date
document.getElementById('today-date').textContent =
    new Date().toLocaleDateString('en-GB', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });

// Load dashboard data
async function loadDashboard() {
    const [rooms, arrivals, departures] = await Promise.all([
        API.rooms.list({ size: 200 }),
        API.reservations.arrivals(),
        API.reservations.departures(),
    ]);

    // Stats
    const roomList = rooms.content || [];
    const occupied   = roomList.filter(r => r.status === 'OCCUPIED').length;
    const available  = roomList.filter(r => r.status === 'AVAILABLE').length;

    document.getElementById('stat-occupied').textContent   = occupied;
    document.getElementById('stat-available').textContent  = available;
    document.getElementById('stat-total-rooms').textContent = roomList.length + ' total rooms';
    document.getElementById('stat-arrivals').textContent   = arrivals.length;
    document.getElementById('stat-departures').textContent = departures.length;

    // Arrivals table
    document.getElementById('arrivals-tbody').innerHTML = arrivals.length
        ? arrivals.map(r => `
            <tr>
                <td><strong>${r.guestFullName || r.guestId}</strong></td>
                <td>${r.roomNumber || r.roomId}</td>
                <td>${Utils.formatNights(r.nights)}</td>
                <td>${Utils.statusBadge(r.status)}</td>
                <td>
                    ${r.status === 'CONFIRMED' ? `
                    <button class="btn btn-gold btn-sm" onclick="checkIn('${r.id}')">
                        Check In
                    </button>` : ''}
                </td>
            </tr>`).join('')
        : '<tr><td colspan="5" class="text-center text-muted py-3">No arrivals today</td></tr>';

    // Departures table
    document.getElementById('departures-tbody').innerHTML = departures.length
        ? departures.map(r => `
            <tr>
                <td><strong>${r.guestFullName || r.guestId}</strong></td>
                <td>${r.roomNumber || r.roomId}</td>
                <td><span class="text-warning small">In-house</span></td>
                <td>${Utils.statusBadge(r.status)}</td>
                <td>
                    <button class="btn btn-outline-secondary btn-sm"
                            onclick="checkOut('${r.id}')">
                        Check Out
                    </button>
                </td>
            </tr>`).join('')
        : '<tr><td colspan="5" class="text-center text-muted py-3">No departures today</td></tr>';
}

async function checkIn(id) {
    try {
        await API.reservations.checkIn(id);
        Utils.toast('Guest checked in successfully');
        await loadDashboard();  // R20 FIX: await so errors are caught
    } catch (e) { Utils.toast(e.message || 'Check-in failed', 'danger'); }
}

async function checkOut(id) {
    try {
        await API.reservations.checkOut(id);
        Utils.toast('Guest checked out — invoice generated');
        await loadDashboard();  // R20 FIX
    } catch (e) { Utils.toast(e.message || 'Check-out failed', 'danger'); }
}

loadDashboard();
</script>
</body>
</html>
