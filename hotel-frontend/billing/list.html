<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Invoices — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="billing">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">Invoices</h2>
    </div>
    <div class="page-body">
        <div class="d-flex gap-2 flex-wrap mb-3">
            <button class="btn btn-gold btn-sm filter-btn" data-status="">All</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="UNPAID">Unpaid</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="PARTIAL">Partial</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="PAID">Paid</button>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr><th>Invoice</th><th>Reservation</th>
                            <th>Total</th><th>Paid</th><th>Balance</th>
                            <th>Status</th><th>Issued</th><th></th></tr>
                    </thead>
                    <tbody id="invoices-tbody"></tbody>
                </table>
            </div>
            <div class="card-body pt-0" id="pagination"></div>
        </div>
    </div>
</div>

<!-- Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Record Payment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Amount (IDR) *</label>
                    <input type="number" id="pay-amount" class="form-control" min="1000" step="1000"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Method *</label>
                    <select id="pay-method" class="form-select">
                        <option value="CASH">Cash</option>
                        <option value="CREDIT_CARD">Credit Card</option>
                        <option value="DEBIT_CARD">Debit Card</option>
                        <option value="BANK_TRANSFER">Bank Transfer</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Reference No.</label>
                    <input type="text" id="pay-ref" class="form-control" placeholder="Card / transfer reference"/>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="pay-submit-btn" class="btn btn-success">Record Payment</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireAuth();
let currentPage = 0, currentStatus = '', selectedInvoiceId = null;
const payModal = new bootstrap.Modal(document.getElementById('paymentModal'));

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('btn-gold'); b.classList.add('btn-outline-secondary');
        });
        btn.classList.add('btn-gold'); btn.classList.remove('btn-outline-secondary');
        currentStatus = btn.dataset.status; currentPage = 0; load();
    });
});

async function load() {
    const params = { page: currentPage, size: 20 };
    if (currentStatus) params.status = currentStatus;
    const data = await API.invoices.list(params);

    document.getElementById('invoices-tbody').innerHTML = (data.content || []).map(inv => `
        <tr>
            <td><small class="text-muted">${inv.invoiceNumber}</small></td>
            <td>
                <small class="text-muted">${inv.reservationNumber}</small>
                ${inv.guestName ? `<br><span class="fw-semibold" style="font-size:0.8rem">${inv.guestName}</span>` : ''}
            </td>
            <td>${Utils.formatRp(inv.totalAmount)}</td>
            <td class="text-success">${Utils.formatRp(inv.totalPaid)}</td>
            <td ${inv.balance > 0 ? 'class="text-danger"' : ''}>${Utils.formatRp(inv.balance)}</td>
            <td>${Utils.statusBadge(inv.paymentStatus)}</td>
            <td>${Utils.formatDate(inv.issuedAt)}</td>
            <td>
                <div class="d-flex gap-1">
                    <a href="/billing/detail.html?id=${inv.id}"
                       class="btn btn-outline-secondary btn-sm">View</a>
                    ${inv.paymentStatus !== 'PAID' ? `
                    <button class="btn btn-gold btn-sm"
                            onclick="openPayment('${inv.id}', ${inv.balance})">Pay</button>` : ''}
                    <button class="btn btn-outline-secondary btn-sm"
                            onclick="downloadPdf('${inv.id}', '${inv.invoiceNumber}')">PDF</button>
                </div>
            </td>
        </tr>`).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">No invoices found</td></tr>';
    Utils.renderPagination('pagination', data, p => { currentPage = p; load(); });
}

function openPayment(id, balance) {
    selectedInvoiceId = id;
    document.getElementById('pay-amount').value = balance;
    payModal.show();
}

document.getElementById('pay-submit-btn').addEventListener('click', async () => {
    const btn = document.getElementById('pay-submit-btn');
    Utils.loading(btn, true);
    try {
        await API.invoices.recordPayment(selectedInvoiceId, {
            amount:      +document.getElementById('pay-amount').value,
            method:       document.getElementById('pay-method').value,
            referenceNo:  document.getElementById('pay-ref').value || null,
        });
        Utils.toast('Payment recorded');
        payModal.hide();
        load();
    } catch (e) { Utils.toast(e.message, 'danger'); }
    Utils.loading(btn, false);
});

async function downloadPdf(id, number) {
    try {
        const blob = await API.invoices.pdf(id);
        Utils.downloadPdf(blob, `${number}.pdf`);
    } catch (e) { Utils.toast('PDF download failed', 'danger'); }
}

load();
</script>
</body>
</html>
