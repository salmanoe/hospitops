# ═══════════════════════════════════════════════════════════════
# hotel-frontend/nginx.conf
#
# Serves the static frontend and proxies /api/* to Spring Boot.
# Mounted into the nginx container by docker-compose.yml.
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Static assets ────────────────────────────────────────
    # HTML, JS and CSS: no-cache in development so changes are picked up immediately.
    # For production, switch JS/CSS to:  expires 1y;  add_header Cache-Control "public, immutable";
    # and add a content-hash suffix to filenames (e.g. core.abc123.js) via your build pipeline.
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Images and fonts can still be cached — they change rarely.
    location ~* \.(png|jpg|jpeg|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── API proxy → Spring Boot ───────────────────────────────
    # Matches the BASE = '/api/v1' constant in core.js.
    # Uses the Compose service name "app" as the upstream hostname.
    #
    # IMPORTANT: nginx resolves proxy_pass hostnames at startup, not per-request.
    # If "app" isn't registered in Docker DNS yet when nginx starts (Spring Boot
    # is still initialising), nginx crashes with "host not found in upstream".
    # Using a variable + resolver forces per-request DNS lookup, so nginx starts
    # independently of the backend and retries resolution on each request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://app:8080;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeout — billing PDF generation can take a few seconds
        proxy_read_timeout 60s;
    }

    # ── Actuator proxy (optional, useful for local debugging) ─
    location /actuator/ {
        set $backend http://app:8080;
        proxy_pass       $backend;
        proxy_set_header Host $host;
    }

    # ── HTML pages ────────────────────────────────────────────
    # Multi-page app — each route is a real .html file.
    # Returns 404 for paths that don't exist (no SPA fallback needed).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
