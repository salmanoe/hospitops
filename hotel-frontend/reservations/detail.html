<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Reservation — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="reservations">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title" id="page-title">Reservation</h2>
        <div class="d-flex gap-2">
            <a href="/reservations/list.html" class="btn btn-outline-secondary btn-sm">← Back</a>
            <button id="checkin-btn"  class="btn btn-gold btn-sm d-none">Check In</button>
            <button id="checkout-btn" class="btn btn-success btn-sm d-none">Check Out</button>
            <button id="cancel-btn"   class="btn btn-outline-danger btn-sm d-none">Cancel</button>
        </div>
    </div>
    <div class="page-body">
        <div style="max-width:760px">

            <!-- Reservation summary card -->
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="text-muted" style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase">Reservation No.</div>
                            <div class="fw-bold" id="res-number">—</div>
                            <div id="res-status" class="mt-1"></div>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <div class="text-muted small">Created</div>
                            <div id="res-created">—</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Guest & room card -->
            <div class="card mb-3">
                <div class="card-header">Stay Details</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="text-muted small">Guest</div>
                            <div id="res-guest" class="fw-semibold">—</div>
                        </div>
                        <div class="col-sm-6">
                            <div class="text-muted small">Room</div>
                            <div id="res-room" class="fw-semibold">—</div>
                        </div>
                        <div class="col-sm-6">
                            <div class="text-muted small">Check-In</div>
                            <div id="res-checkin">—</div>
                        </div>
                        <div class="col-sm-6">
                            <div class="text-muted small">Check-Out</div>
                            <div id="res-checkout">—</div>
                        </div>
                        <div class="col-sm-6">
                            <div class="text-muted small">Nights</div>
                            <div id="res-nights">—</div>
                        </div>
                        <div class="col-sm-6">
                            <div class="text-muted small">Guests</div>
                            <div id="res-guests">—</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pricing card -->
            <div class="card mb-3">
                <div class="card-header">Pricing</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="text-muted small">Rate / Night</div>
                            <div id="res-rate">—</div>
                        </div>
                        <div class="col-sm-6">
                            <div class="text-muted small">Subtotal</div>
                            <div id="res-subtotal" class="fw-bold" style="color:var(--hospitops-gold)">—</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Special requests card (hidden when empty) -->
            <div class="card mb-3 d-none" id="requests-card">
                <div class="card-header">Special Requests</div>
                <div class="card-body">
                    <p id="res-requests" class="mb-0 text-muted fst-italic">—</p>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Cancel confirmation modal -->
<div class="modal fade" id="cancelModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cancel Reservation</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to cancel reservation <strong id="cancel-res-number"></strong>?
                   This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Keep Reservation</button>
                <button type="button" id="cancel-confirm-btn" class="btn btn-danger">Cancel Reservation</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireAuth();
const reservationId = Utils.getParam('id');
const cancelModal   = new bootstrap.Modal(document.getElementById('cancelModal'));
let reservation;

async function load() {
    reservation = await API.reservations.get(reservationId);

    document.getElementById('page-title').textContent =
        reservation.reservationNumber || 'Reservation';
    document.getElementById('res-number').textContent  = reservation.reservationNumber;
    document.getElementById('res-status').innerHTML    = Utils.statusBadge(reservation.status);
    document.getElementById('res-created').textContent = Utils.formatDateTime(reservation.createdAt);

    document.getElementById('res-guest').textContent   = reservation.guestFullName || reservation.guestId;
    document.getElementById('res-room').textContent    = reservation.roomNumber    || reservation.roomId;
    document.getElementById('res-checkin').textContent  = Utils.formatDate(reservation.checkInDate);
    document.getElementById('res-checkout').textContent = Utils.formatDate(reservation.checkOutDate);
    document.getElementById('res-nights').textContent   = Utils.formatNights(reservation.nights);

    const adults   = reservation.adults   || 0;
    const children = reservation.children || 0;
    const guestParts = [`${adults} adult${adults !== 1 ? 's' : ''}`];
    if (children > 0) guestParts.push(`${children} child${children !== 1 ? 'ren' : ''}`);
    document.getElementById('res-guests').textContent = guestParts.join(', ');

    document.getElementById('res-rate').textContent    = Utils.formatRp(reservation.ratePerNight);
    document.getElementById('res-subtotal').textContent = Utils.formatRp(reservation.subtotal);

    if (reservation.specialRequests) {
        document.getElementById('res-requests').textContent = reservation.specialRequests;
        document.getElementById('requests-card').classList.remove('d-none');
    }

    // Show action buttons based on current status
    if (reservation.status === 'CONFIRMED') {
        document.getElementById('checkin-btn').classList.remove('d-none');
        document.getElementById('cancel-btn').classList.remove('d-none');
    }
    if (reservation.status === 'CHECKED_IN') {
        document.getElementById('checkout-btn').classList.remove('d-none');
    }
}

document.getElementById('checkin-btn').addEventListener('click', async () => {
    const btn = document.getElementById('checkin-btn');
    Utils.loading(btn, true);
    try {
        await API.reservations.checkIn(reservationId);
        Utils.toast('Guest checked in successfully');
        load();
    } catch (e) { Utils.toast(e.message, 'danger'); }
    Utils.loading(btn, false);
});

document.getElementById('checkout-btn').addEventListener('click', async () => {
    const btn = document.getElementById('checkout-btn');
    Utils.loading(btn, true);
    try {
        await API.reservations.checkOut(reservationId);
        Utils.toast('Guest checked out — invoice generated');
        load();
    } catch (e) { Utils.toast(e.message, 'danger'); }
    Utils.loading(btn, false);
});

document.getElementById('cancel-btn').addEventListener('click', () => {
    document.getElementById('cancel-res-number').textContent = reservation.reservationNumber;
    cancelModal.show();
});

document.getElementById('cancel-confirm-btn').addEventListener('click', async () => {
    const btn = document.getElementById('cancel-confirm-btn');
    Utils.loading(btn, true);
    try {
        await API.reservations.cancel(reservationId);
        Utils.toast('Reservation cancelled');
        cancelModal.hide();
        load();
    } catch (e) { Utils.toast(e.message, 'danger'); }
    Utils.loading(btn, false);
});

load();
</script>
</body>
</html>
