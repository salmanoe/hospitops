<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>New Booking — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="new-reservation">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">New Booking</h2>
        <a href="/reservations/list.html" class="btn btn-outline-secondary btn-sm">← Back</a>
    </div>
    <div class="page-body">
        <div style="max-width:820px">
            <form id="booking-form" novalidate>

                <!-- Guest search -->
                <div class="card mb-3">
                    <div class="card-header">Guest</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Search Guest</label>
                                <input type="text" id="guest-search" class="form-control"
                                       placeholder="Name or ID number…" autocomplete="off"/>
                                <div id="guest-suggestions" class="list-group mt-1 position-absolute"
                                     style="z-index:999;width:calc(100% - 30px);display:none;background:var(--hospitops-surface);border:1px solid var(--bs-border-color);">
                                </div>
                                <input type="hidden" id="guest-id" name="guestId"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Selected Guest</label>
                                <input type="text" id="guest-display" class="form-control"
                                       placeholder="No guest selected" readonly
                                       style="background:var(--bs-body-bg);cursor:default"/>
                            </div>
                        </div>
                        <div class="mt-2">
                            <a href="/guests/form.html" target="_blank"
                               class="btn btn-outline-secondary btn-sm">＋ Register New Guest</a>
                        </div>
                    </div>
                </div>

                <!-- Dates + Guests -->
                <div class="card mb-3">
                    <div class="card-header">Booking Details</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Check-In *</label>
                                <input type="date" name="checkIn" class="form-control" required/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Check-Out *</label>
                                <input type="date" name="checkOut" class="form-control" required/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Adults</label>
                                <input type="number" name="adults" class="form-control"
                                       value="1" min="1" max="10"/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Children</label>
                                <input type="number" name="children" class="form-control"
                                       value="0" min="0" max="10"/>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Room Selection -->
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Select Room</span>
                        <button type="button" id="find-rooms-btn" class="btn btn-gold btn-sm">
                            Find Available Rooms
                        </button>
                    </div>
                    <div class="card-body">
                        <input type="hidden" id="room-id" name="roomId"/>
                        <div id="rooms-placeholder" class="text-muted text-center py-3">
                            Enter dates and click "Find Available Rooms"
                        </div>
                        <div id="rooms-table" class="table-responsive d-none">
                            <table class="table table-hover">
                                <thead>
                                    <tr><th></th><th>Room</th><th>Type</th><th>Floor</th>
                                        <th>Capacity</th><th>Rate/Night</th></tr>
                                </thead>
                                <tbody id="rooms-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Special Requests -->
                <div class="card mb-4">
                    <div class="card-header">Additional Info</div>
                    <div class="card-body">
                        <label class="form-label">Special Requests</label>
                        <textarea name="specialRequests" class="form-control" rows="3"
                                  placeholder="e.g. high floor, extra bed, late check-in…"></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a href="/reservations/list.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" id="submit-btn" class="btn btn-gold">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireAuth();

// R11 FIX: Set minimum dates on page load
const today = new Date().toISOString().split('T')[0];
document.querySelector('[name="checkIn"]').min  = today;
document.querySelector('[name="checkOut"]').min = today;

// When check-in changes, update check-out minimum to next day
document.querySelector('[name="checkIn"]').addEventListener('change', (e) => {
    if (!e.target.value) return;
    const nextDay = new Date(e.target.value);
    nextDay.setDate(nextDay.getDate() + 1);
    const checkOutInput = document.querySelector('[name="checkOut"]');
    checkOutInput.min = nextDay.toISOString().split('T')[0];
    // Clear check-out if it's now before the new minimum
    if (checkOutInput.value && checkOutInput.value <= e.target.value) {
        checkOutInput.value = '';
    }
});

// Guest autocomplete
const guestSearch = document.getElementById('guest-search');
const suggestions = document.getElementById('guest-suggestions');

guestSearch.addEventListener('input', Utils.debounce(async () => {
    const q = guestSearch.value.trim();
    if (q.length < 2) { suggestions.style.display = 'none'; return; }
    const results = await API.guests.search(q);
    suggestions.innerHTML = results.map(g => `
        <a href="#" class="list-group-item list-group-item-action"
           style="background:var(--hospitops-surface);color:var(--bs-body-color);border-color:var(--bs-border-color)"
           data-id="${g.id}" data-name="${g.fullName}">
            <strong>${g.fullName}</strong>
            <small class="text-muted ms-2">${g.idNumber || ''}</small>
        </a>`).join('') || '<div class="list-group-item text-muted">No results</div>';
    suggestions.style.display = 'block';
}, 300));

suggestions.addEventListener('click', (e) => {
    const item = e.target.closest('[data-id]');
    if (!item) return;
    e.preventDefault();
    document.getElementById('guest-id').value = item.dataset.id;
    document.getElementById('guest-display').value = item.dataset.name;
    guestSearch.value = item.dataset.name;
    suggestions.style.display = 'none';
});

document.addEventListener('click', (e) => {
    if (!guestSearch.contains(e.target)) suggestions.style.display = 'none';
});

// Find rooms
document.getElementById('find-rooms-btn').addEventListener('click', async () => {
    const checkIn  = document.querySelector('[name="checkIn"]').value;
    const checkOut = document.querySelector('[name="checkOut"]').value;
    if (!checkIn || !checkOut) { Utils.toast('Please select check-in and check-out dates', 'warning'); return; }

    const rooms = await API.rooms.available(checkIn, checkOut);
    document.getElementById('rooms-placeholder').classList.add('d-none');
    document.getElementById('rooms-table').classList.remove('d-none');

    document.getElementById('rooms-tbody').innerHTML = rooms.length
        ? rooms.map(r => `
            <tr style="cursor:pointer" onclick="selectRoom('${r.id}', this)">
                <td><input type="radio" name="roomSelect" value="${r.id}"></td>
                <td><strong>${r.roomNumber}</strong></td>
                <td>${r.roomTypeName}</td>
                <td>${r.floor}</td>
                <td>${r.capacity} pax</td>
                <td>${Utils.formatRp(r.effectiveRate)}</td>
            </tr>`).join('')
        : '<tr><td colspan="6" class="text-center text-muted py-3">No rooms available for selected dates</td></tr>';
});

function selectRoom(id, row) {
    document.getElementById('room-id').value = id;
    document.querySelectorAll('#rooms-tbody tr').forEach(r => r.classList.remove('table-active'));
    row.classList.add('table-active');
    row.querySelector('input[type=radio]').checked = true;
}

// Submit
document.getElementById('booking-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    Utils.loading(btn, true);

    const data = Utils.formData(e.target);
    data.guestId = document.getElementById('guest-id').value;
    data.roomId  = document.getElementById('room-id').value;
    data.adults  = +data.adults;
    data.children = +data.children;

    if (!data.guestId) { Utils.toast('Please select a guest', 'warning'); Utils.loading(btn, false); return; }
    if (!data.roomId)  { Utils.toast('Please select a room', 'warning'); Utils.loading(btn, false); return; }

    try {
        await API.reservations.create(data);
        Utils.toast('Booking confirmed!');
        window.location.href = '/reservations/list.html';
    } catch (e) {
        Utils.setFormErrors(e.details || {});
        Utils.toast(e.message, 'danger');
        Utils.loading(btn, false);
    }
});
</script>
</body>
</html>
