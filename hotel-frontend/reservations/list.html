<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Reservations — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="reservations">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">Reservations</h2>
        <a href="/reservations/new.html" class="btn btn-gold btn-sm">＋ New Booking</a>
    </div>
    <div class="page-body">

        <!-- Filters -->
        <div class="d-flex gap-2 flex-wrap mb-3">
            <button class="btn btn-gold btn-sm filter-btn" data-status="">All</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="CONFIRMED">Confirmed</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="CHECKED_IN">In-House</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="CHECKED_OUT">Checked Out</button>
            <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="CANCELLED">Cancelled</button>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>No.</th><th>Guest</th><th>Room</th>
                            <th>Check-In</th><th>Check-Out</th>
                            <th>Nights</th><th>Status</th><th></th>
                        </tr>
                    </thead>
                    <tbody id="res-tbody">
                        <tr><td colspan="8" class="text-center py-4">
                            <div class="spinner-border spinner-border-sm"></div>
                        </td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-body pt-0" id="pagination"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireAuth();
let currentPage = 0, currentStatus = '';

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('btn-gold');
            b.classList.add('btn-outline-secondary');
        });
        btn.classList.add('btn-gold');
        btn.classList.remove('btn-outline-secondary');
        currentStatus = btn.dataset.status;
        currentPage = 0;
        load();
    });
});

async function load() {
    const params = { page: currentPage, size: 20 };
    if (currentStatus) params.status = currentStatus;
    const data = await API.reservations.list(params);

    document.getElementById('res-tbody').innerHTML = (data.content || []).length
        ? data.content.map(r => `
            <tr>
                <td><small class="text-muted">${r.reservationNumber}</small></td>
                <td>${r.guestFullName || r.guestId}</td>
                <td>${r.roomNumber || r.roomId}</td>
                <td>${Utils.formatDate(r.checkInDate)}</td>
                <td>${Utils.formatDate(r.checkOutDate)}</td>
                <td>${Utils.formatNights(r.nights)}</td>
                <td>${Utils.statusBadge(r.status)}</td>
                <td>
                    <div class="d-flex gap-1">
                        <a href="/reservations/detail.html?id=${r.id}"
                           class="btn btn-outline-secondary btn-sm">View</a>
                        ${r.status === 'CONFIRMED' ? `
                        <button class="btn btn-gold btn-sm"
                                onclick="doAction('checkin','${r.id}')">Check In</button>` : ''}
                        ${r.status === 'CHECKED_IN' ? `
                        <button class="btn btn-success btn-sm"
                                onclick="doAction('checkout','${r.id}')">Check Out</button>` : ''}
                    </div>
                </td>
            </tr>`).join('')
        : '<tr><td colspan="8" class="text-center text-muted py-4">No reservations found</td></tr>';

    Utils.renderPagination('pagination', data, p => { currentPage = p; load(); });
}

async function doAction(action, id) {
    try {
        if (action === 'checkin')  await API.reservations.checkIn(id);
        if (action === 'checkout') await API.reservations.checkOut(id);
        Utils.toast(action === 'checkin' ? 'Guest checked in' : 'Guest checked out — invoice generated');
        load();
    } catch (e) { Utils.toast(e.message, 'danger'); }
}

load();
</script>
</body>
</html>
