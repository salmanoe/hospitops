<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Staff — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="staff">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">Staff</h2>
        <a href="/staff/form.html" class="btn btn-gold btn-sm">＋ Add Staff</a>
    </div>
    <div class="page-body">
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr><th>Name</th><th>Username</th><th>Role</th>
                            <th>Status</th><th>Since</th><th></th></tr>
                    </thead>
                    <tbody id="staff-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireRole('ADMIN', 'MANAGER', 'GROUP_ADMIN');

async function load() {
    const data = await API.staff.list({ size: 100 });
    document.getElementById('staff-tbody').innerHTML = (data.content || []).map(s => `
        <tr>
            <td><strong>${s.fullName}</strong></td>
            <td class="text-muted">${s.username}</td>
            <td>${Utils.statusBadge(s.role)}</td>
            <td>
                <span class="badge ${s.active ? 'bg-success' : 'bg-secondary'}">
                    ${s.active ? 'Active' : 'Inactive'}
                </span>
            </td>
            <td>${Utils.formatDate(s.createdAt)}</td>
            <td>
                <div class="d-flex gap-1">
                    <a href="/staff/form.html?id=${s.id}"
                       class="btn btn-outline-secondary btn-sm">Edit</a>
                    <button class="btn btn-sm ${s.active ? 'btn-outline-danger' : 'btn-outline-success'}"
                            onclick="toggle('${s.id}', ${s.active})">
                        ${s.active ? 'Deactivate' : 'Activate'}
                    </button>
                </div>
            </td>
        </tr>`).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">No staff found</td></tr>';
}

async function toggle(id, isActive) {
    const action = isActive ? 'Deactivate' : 'Activate';
    if (!confirm(`${action} this staff member?`)) return;
    try {
        await API.staff.toggle(id);
        Utils.toast(`Staff ${action.toLowerCase()}d`);
        load();
    } catch (e) { Utils.toast(e.message, 'danger'); }
}

load();
</script>
</body>
</html>
