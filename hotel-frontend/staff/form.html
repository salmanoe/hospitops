<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Staff — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="staff">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title" id="page-title">Add Staff</h2>
        <a id="back-btn" href="/staff/list.html" class="btn btn-outline-secondary btn-sm">← Back</a>
    </div>
    <div class="page-body">
        <!-- Setup wizard context banner -->
        <div id="setup-banner" class="alert alert-info d-flex align-items-center gap-3 mb-3 d-none">
            <div class="flex-grow-1">
                <strong>Setup Step 5 of 5 — First Staff Account</strong><br>
                <span class="small">Create an ADMIN or MANAGER account, then the hotel will go ACTIVE automatically.</span>
            </div>
            <a id="setup-back-link" href="#" class="btn btn-outline-primary btn-sm">← Back to Setup</a>
        </div>
        <div style="max-width:520px">
            <form id="staff-form" novalidate>

                <div class="card mb-3">
                    <div class="card-header">Staff Details</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Full Name *</label>
                                <input type="text" name="fullName" class="form-control"
                                       placeholder="Staff full name" required/>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Username *</label>
                                <input type="text" name="username" id="username-field"
                                       class="form-control" placeholder="Login username" required/>
                                <div class="form-text" id="username-hint"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" id="password-label">Password *</label>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Minimum 8 characters"/>
                                <div class="form-text" id="password-hint"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Role *</label>
                                <select name="role" class="form-select" required>
                                    <option value="">— Select role —</option>
                                    <option value="FRONT_DESK">Front Desk</option>
                                    <option value="HOUSEKEEPING">Housekeeping</option>
                                    <option value="ACCOUNTANT">Accountant</option>
                                    <option value="MANAGER">Manager</option>
                                    <option value="ADMIN">Admin</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a id="cancel-btn" href="/staff/list.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" id="submit-btn" class="btn btn-gold">Save Staff</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireRole('ADMIN', 'MANAGER', 'GROUP_ADMIN');
const staffId = Utils.getParam('id');
const isEdit  = !!staffId;

// Setup wizard context — present when arriving from setup.html
const setupHotelId = Utils.getParam('setupHotelId');
const setupWizardUrl = setupHotelId ? `/group/hotels/setup.html?hotelId=${setupHotelId}` : null;

if (setupWizardUrl) {
    document.getElementById('setup-banner').classList.remove('d-none');
    document.getElementById('setup-back-link').href = setupWizardUrl;
    document.getElementById('back-btn').href = setupWizardUrl;
    document.getElementById('back-btn').textContent = '← Setup Wizard';
    document.getElementById('cancel-btn').href = setupWizardUrl;
}

async function init() {
    document.getElementById('page-title').textContent = isEdit ? 'Edit Staff' : 'Add Staff';

    if (isEdit) {
        document.getElementById('username-field').readOnly = true;
        document.getElementById('username-hint').textContent = 'Username cannot be changed.';
        document.getElementById('password-label').textContent = 'New Password (leave blank to keep current)';
        document.getElementById('password-hint').textContent = 'Only fill in if changing the password.';
        document.querySelector('[name="password"]').required = false;

        const s = await API.staff.get(staffId);
        document.querySelector('[name="fullName"]').value = s.fullName;
        document.querySelector('[name="username"]').value = s.username;
        document.querySelector('[name="role"]').value     = s.role;
    }
}

document.getElementById('staff-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn      = document.getElementById('submit-btn');
    const data     = Utils.formData(e.target);
    const password = data.password;
    delete data.password;
    Utils.loading(btn, true);

    try {
        if (isEdit) {
            await API.staff.update(staffId, { fullName: data.fullName, role: data.role });
            if (password) {
                await API.staff.changePassword(staffId, { currentPassword: '', newPassword: password });
            }
        } else {
            await API.staff.create({ ...data, password });
        }
        if (!isEdit && setupWizardUrl) {
            // Auto-complete the STAFF_ACCOUNT setup step now that a real account exists.
            // This is the final step — the wizard will transition the hotel to ACTIVE.
            await API.hotels.completeSetupStep(setupHotelId, 'STAFF_ACCOUNT');
            Utils.toast('Staff created — setup complete!');
            window.location.href = setupWizardUrl;
        } else {
            Utils.toast(isEdit ? 'Staff updated' : 'Staff created');
            window.location.href = '/staff/list.html';
        }
    } catch (err) {
        Utils.setFormErrors(err.details || {});
        Utils.toast(err.message, 'danger');
        Utils.loading(btn, false);
    }
});

init();
</script>
</body>
</html>
