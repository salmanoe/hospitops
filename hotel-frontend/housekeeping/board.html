<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Housekeeping — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="housekeeping">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">Housekeeping Board</h2>
        <div class="d-none d-md-flex gap-2 align-items-center">
            <span class="badge bg-success">● Available</span>
            <span class="badge bg-warning text-dark">● Occupied</span>
            <span class="badge bg-secondary">● Dirty</span>
            <span class="badge bg-danger">● Maintenance</span>
        </div>
    </div>
    <div class="page-body" id="board-container">
        <div class="text-center py-5">
            <div class="spinner-border" style="color:var(--hospitops-gold)"></div>
        </div>
    </div>
</div>

<!-- Update Status Modal -->
<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Room <span id="modal-room-no"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">New Status</label>
                    <select id="modal-status" class="form-select">
                        <option value="AVAILABLE">Available (Clean)</option>
                        <option value="DIRTY">Dirty</option>
                        <option value="MAINTENANCE">Maintenance</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes (optional)</label>
                    <textarea id="modal-notes" class="form-control" rows="2"
                              placeholder="e.g. broken AC, needs towels…"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="modal-save-btn" class="btn btn-gold">Update</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireAuth();
let selectedRoomId = null;
const modal = new bootstrap.Modal(document.getElementById('statusModal'));

async function load() {
    const floors = await API.housekeeping.board();
    document.getElementById('board-container').innerHTML = floors.map(f => `
        <div class="mb-4">
            <div class="text-muted mb-2" style="font-size:10px;letter-spacing:2px;text-transform:uppercase">
                Floor ${f.floor}
            </div>
            <div class="d-flex flex-wrap gap-2">
                ${f.rooms.map(r => `
                <div class="hk-room-card status-${r.status}" data-id="${r.roomId}"
                     onclick="openModal('${r.roomId}', '${r.roomNumber}', '${r.status}')">
                    <div class="room-num">${r.roomNumber}</div>
                    <div class="text-muted" style="font-size:11px">${r.roomTypeName}</div>
                    <div class="mt-1">${Utils.statusBadge(r.status)}</div>
                </div>`).join('')}
            </div>
        </div>`).join('');
}

function openModal(roomId, roomNumber, currentStatus) {
    selectedRoomId = roomId;
    document.getElementById('modal-room-no').textContent = roomNumber;
    document.getElementById('modal-status').value = currentStatus;
    document.getElementById('modal-notes').value = '';
    modal.show();
}

document.getElementById('modal-save-btn').addEventListener('click', async () => {
    const status = document.getElementById('modal-status').value;
    const notes  = document.getElementById('modal-notes').value;
    Utils.loading(document.getElementById('modal-save-btn'), true);
    try {
        await API.housekeeping.updateRoomStatus(selectedRoomId, {
            status: document.getElementById('modal-status').value,
            notes:  document.getElementById('modal-notes').value || null,
        });
        Utils.toast('Room status updated');
        modal.hide();
        load();
    } catch (e) {
        Utils.toast(e.message, 'danger');
    }
    Utils.loading(document.getElementById('modal-save-btn'), false);
});

load();
</script>
</body>
</html>
