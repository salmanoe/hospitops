<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Guest — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="guests">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title" id="page-title">Register Guest</h2>
        <a href="/guests/list.html" class="btn btn-outline-secondary btn-sm">← Back</a>
    </div>
    <div class="page-body">
        <div style="max-width:640px">
            <form id="guest-form" novalidate>

                <div class="card mb-3">
                    <div class="card-header">Personal Information</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Full Name * <small class="text-muted">(as on ID document)</small></label>
                                <input type="text" name="fullName" class="form-control"
                                       placeholder="Full legal name" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ID Number <small class="text-muted">(Passport / KTP)</small></label>
                                <input type="text" name="idNumber" class="form-control"
                                       placeholder="Passport or national ID"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nationality</label>
                                <input type="text" name="nationality" class="form-control"
                                       placeholder="e.g. Indonesian"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">Contact Information</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" name="phone" class="form-control"
                                       placeholder="+62 812 3456 7890"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address</label>
                                <input type="email" name="email" class="form-control"
                                       placeholder="guest@example.com"/>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <textarea name="address" class="form-control" rows="2"
                                          placeholder="Street, city, province…"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a href="/guests/list.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" id="submit-btn" class="btn btn-gold">Save Guest</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireAuth();
const guestId = Utils.getParam('id');
const isEdit  = !!guestId;

async function init() {
    document.getElementById('page-title').textContent = isEdit ? 'Edit Guest' : 'Register Guest';
    if (!isEdit) return;

    const g = await API.guests.get(guestId);
    const fields = ['fullName','idNumber','nationality','phone','email','address'];
    fields.forEach(f => {
        const el = document.querySelector(`[name="${f}"]`);
        if (el) el.value = g[f] || '';
    });
}

document.getElementById('guest-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn  = document.getElementById('submit-btn');
    Utils.loading(btn, true);
    const data = Utils.formData(e.target);

    try {
        if (isEdit) await API.guests.update(guestId, data);
        else        await API.guests.register(data);
        Utils.toast(isEdit ? 'Guest updated' : 'Guest registered');
        window.location.href = '/guests/list.html';
    } catch (err) {
        Utils.setFormErrors(err.details || {});
        Utils.toast(err.message, 'danger');
        Utils.loading(btn, false);
    }
});

init();
</script>
</body>
</html>
