<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Guests — HospitOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/assets/css/custom.css" rel="stylesheet"/>
</head>
<body data-page="guests">
<div id="sidebar"></div>
<div id="main-content">
    <div class="topbar">
        <h2 class="page-title">Guests</h2>
        <a href="/guests/form.html" class="btn btn-gold btn-sm">＋ Register Guest</a>
    </div>
    <div class="page-body">
        <div class="mb-3">
            <input type="text" id="search-input" class="form-control"
                   placeholder="Search by name or ID number…" style="max-width:340px"/>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr><th>Name</th><th>ID Number</th><th>Nationality</th>
                            <th>Phone</th><th>Email</th><th>Registered</th><th></th></tr>
                    </thead>
                    <tbody id="guests-tbody"></tbody>
                </table>
            </div>
            <div class="card-body pt-0" id="pagination"></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
Auth.requireAuth();
let currentPage = 0, query = '';

document.getElementById('search-input').addEventListener('input',
    Utils.debounce(e => { query = e.target.value; currentPage = 0; load(); }, 350));

async function load() {
    const params = { page: currentPage, size: 20 };
    if (query) params.q = query;
    const data = await API.guests.list(params);
    document.getElementById('guests-tbody').innerHTML = (data.content || []).map(g => `
        <tr>
            <td><strong>${g.fullName}</strong></td>
            <td class="text-muted">${g.idNumber || '—'}</td>
            <td>${g.nationality || '—'}</td>
            <td>${g.phone || '—'}</td>
            <td>${g.email || '—'}</td>
            <td>${Utils.formatDate(g.createdAt)}</td>
            <td>
                <a href="/guests/form.html?id=${g.id}" class="btn btn-outline-secondary btn-sm">Edit</a>
            </td>
        </tr>`).join('') || '<tr><td colspan="7" class="text-center text-muted py-4">No guests found</td></tr>';
    Utils.renderPagination('pagination', data, p => { currentPage = p; load(); });
}
load();
</script>
</body>
</html>
